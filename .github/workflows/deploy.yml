# Build the site and put it in front of visitors.
#
# Same shape as negative-space's deploy.yml, which is the house pattern and
# documents why it exists: a repo without this ships only when somebody
# remembers to run `cf-run npm run deploy` from a laptop, and drifts from that
# moment on. Needs CLOUDFLARE_API_TOKEN as a repo secret and
# CLOUDFLARE_ACCOUNT_ID as a repo variable.

name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/dependabot.yml"
  workflow_dispatch:

# Newest push wins. wrangler uploads assets first and activates the version as
# one step at the end, so a cancelled run never becomes the live version.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check the Cloudflare token is present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on this repository, so the"
            echo "::error::site cannot be deployed. The keychain entry cf-run uses"
            echo "::error::(service 'stoatworks-cloudflare') holds the same token:"
            echo "::error::  gh secret set CLOUDFLARE_API_TOKEN --repo stoatworks-labs/flasher"
            exit 1
          fi
          echo "token present - ok"

      - run: npm ci

      # The suite runs every bundled image through the same checkPlan() the page
      # runs before a write, and re-hashes it against the manifest. That is what
      # makes publishing firmware on push defensible.
      - run: npm test

      - run: npm run build

      # wrangler is pinned here because it is not a dependency of the project.
      # Bump it deliberately.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.116.0 deploy

      # Prove it landed. The <head> is untouched by Cloudflare's injected
      # bot-management script and carries the hashed asset names, so hashing it
      # catches a code change and a meta-only change alike.
      - name: Check the live site is serving this build
        run: |
          set -euo pipefail
          want=$(sed -n '1,/<\/head>/p' dist/index.html | shasum -a 256 | cut -d' ' -f1)
          echo "expecting the live <head> to hash to $want"
          for attempt in 1 2 3 4 5; do
            got=$(curl -sS --max-time 30 "https://flasher.stoatworks-labs.com/" \
                  | sed -n '1,/<\/head>/p' | shasum -a 256 | cut -d' ' -f1 || true)
            if [ "$got" = "$want" ]; then
              echo "live site is serving this build (attempt $attempt)"
              exit 0
            fi
            echo "not there yet, got $got — retrying in 10s (attempt $attempt)"
            sleep 10
          done
          echo "::error::Deployed, but https://flasher.stoatworks-labs.com/ is still"
          echo "::error::not serving this build's <head>. Check the Worker's routes, and that"
          echo "::error::flasher.stoatworks-labs.com still has its proxied AAAA 100:: record."
          exit 1

      # The old address. This was CANary Flasher at canary-flasher.stoatworks-labs.com
      # until 2026-11-06; that domain now forwards here from its own small Worker in
      # redirect/. It goes out after the site has proved itself live, so the old
      # address never forwards to a domain that isn't serving yet.
      - name: Deploy the old address's redirect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.116.0 deploy --config redirect/wrangler.toml

      - name: Check the old address forwards, with the CANary chosen
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            got=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 30 \
                  "https://canary-flasher.stoatworks-labs.com/" || true)
            if [ "$got" = "301 https://flasher.stoatworks-labs.com/?device=canary" ]; then
              echo "old address forwards (attempt $attempt)"
              exit 0
            fi
            echo "not yet: $got — retrying in 10s (attempt $attempt)"
            sleep 10
          done
          echo "::error::canary-flasher.stoatworks-labs.com does not forward to the flasher."
          exit 1

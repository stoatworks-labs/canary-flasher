# Cloudflare deployment for Stoatworks Flasher.
#
# A static-assets-only Worker: no server code. Built by the deploy workflow in
# .github/workflows/deploy.yml (npm ci && npm run build), never by a Cloudflare
# dashboard build — none is connected, and a comment saying otherwise is how
# five fleet sites drifted weeks behind main. Check with:
#
#   cf-run npx wrangler deployments list
#
# `public/_headers` is copied into dist/ by Vite and carries the CSP and the
# immutable-cache rule for hashed assets; the assets runtime honours it.
#
# This was CANary Flasher, deployed as the Worker "dbcanary-flasher" on the custom
# domain canary-flasher.stoatworks-labs.com. Since 2026-11-06 it is "flasher", and
# that old Worker is the redirect in redirect/.
#
# The host is a ROUTE, not a custom domain: stoatworks-labs.com is at Cloudflare's
# 100 custom domains per zone (error 100122). A route needs a proxied DNS record to
# exist, so flasher.stoatworks-labs.com has an AAAA 100:: record, made through the
# API, as cosplay and edid-editor have.

name = "flasher"
compatibility_date = "2026-07-30"

[assets]
directory = "./dist"

[[routes]]
pattern = "flasher.stoatworks-labs.com/*"
zone_name = "stoatworks-labs.com"
